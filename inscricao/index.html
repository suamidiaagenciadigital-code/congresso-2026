<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscrição — Congresso Fenapestalozzi 2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.12); max-width: 440px; width: 100%; padding: 36px 32px; text-align: center; }
  .logo-evento { font-size: 1.1rem; font-weight: 700; color: #1a5276; margin-bottom: 24px; letter-spacing: .02em; }
  .nome { font-size: 1.5rem; font-weight: 700; color: #222; margin-bottom: 8px; }
  .cpf  { font-size: .95rem; color: #666; margin-bottom: 24px; font-family: monospace; letter-spacing: .08em; }
  .qr-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
  .qr-wrap img { width: 200px; height: 200px; border: 3px solid #eee; border-radius: 8px; }
  .qr-placeholder { width: 200px; height: 200px; border: 3px dashed #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: .85rem; }
  .data-label { font-size: .8rem; color: #999; margin-bottom: 4px; }
  .data-valor { font-size: .95rem; color: #444; margin-bottom: 24px; }
  .rodape { font-size: .78rem; color: #bbb; margin-top: 8px; }
  .loading { color: #888; }
  .erro-wrap h2 { color: #c0392b; margin-bottom: 12px; }
  .erro-wrap p  { color: #666; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="loading">Carregando...</div>
</div>

<script>
async function carregar() {
  // Lê o hash da URL: /inscricao/abc123...
  const partes = window.location.pathname.split('/').filter(Boolean);
  const hash = partes[partes.length - 1];

  if (!hash || !/^[a-f0-9]{32}$/.test(hash)) {
    renderErro('Código de inscrição inválido.');
    return;
  }

  try {
    const resp = await fetch(`/api/inscrito?h=${hash}`);
    const json = await resp.json();
    if (!json.success) { renderErro(json.mensagem || 'Inscrição não encontrada.'); return; }
    renderInscrito(json.dados);
  } catch(e) {
    renderErro('Erro de conexão. Tente novamente.');
  }
}

function renderInscrito(d) {
  document.title = `${d.nome} — Congresso Fenapestalozzi 2026`;
  document.getElementById('card').innerHTML = `
    <div class="logo-evento">Congresso Fenapestalozzi 2026</div>
    <div class="nome">${esc(d.nome)}</div>
    <div class="cpf">${esc(d.cpf_parcial)}</div>
    <div class="qr-wrap">
      ${d.qrcode_url
        ? `<img src="${esc(d.qrcode_url)}" alt="QR Code de credenciamento">`
        : `<div class="qr-placeholder">QR Code<br>indisponível</div>`}
    </div>
    <div class="data-label">Inscrito em</div>
    <div class="data-valor">${esc(d.data_inscricao)}</div>
    <div class="rodape">Fenapestalozzi 2026 — Apresente este QR Code no credenciamento.</div>
  `;
}

function renderErro(msg) {
  document.getElementById('card').innerHTML = `
    <div class="erro-wrap">
      <h2>Inscrição não encontrada</h2>
      <p>${esc(msg)}</p>
    </div>
  `;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

carregar();
</script>
</body>
</html>
