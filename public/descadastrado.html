<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descadastro realizado — XVII Congresso Fenapestalozzi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 {
      font-size: 22px;
      color: #1a1a2e;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .nota {
      font-size: 13px;
      color: #999;
      border-top: 1px solid #eee;
      padding-top: 16px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Descadastro realizado com sucesso</h1>
    <p>Seu e-mail foi removido da nossa lista de envios. Você não receberá mais comunicações por e-mail deste evento.</p>
    <p class="nota">Caso tenha se descadastrado por engano, entre em contato com a organização do XVII Congresso Fenapestalozzi.</p>
  </div>
</body>
</html>
