<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — XVII Congresso Fenapestalozzi 2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; color: #333; }
  header { background: #402B16; color: #fff; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.1rem; }
  header a { color: #dacabb; font-size: .85rem; text-decoration: none; cursor: pointer; }
  header a:hover { color: #fff; }
  .container { max-width: 1300px; margin: 0 auto; padding: 24px 20px; }
  .counters { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .counter { background: #fff; border-radius: 8px; padding: 16px 24px; flex: 1; min-width: 160px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
  .counter .num { font-size: 2rem; font-weight: 700; color: #402B16; }
  .counter .lbl { font-size: .83rem; color: #888; margin-top: 2px; }
  .filtros { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 1px 6px rgba(0,0,0,.08); display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .filtros label { font-size: .82rem; font-weight: 600; color: #555; display: block; margin-bottom: 4px; }
  .filtros input, .filtros select { padding: 8px 10px; border: 1.5px solid #ccc; border-radius: 6px; font-size: .88rem; min-width: 160px; }
  .filtros input:focus, .filtros select:focus { outline: none; border-color: #402B16; }
  .btn { padding: 8px 18px; border: none; border-radius: 6px; font-size: .88rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-filtrar  { background: #402B16; color: #fff; }
  .btn-limpar   { background: #eee; color: #555; }
  .btn-csv      { background: #1e8449; color: #fff; }
  .btn-cert     { background: #8e44ad; color: #fff; }
  .btn-ver      { background: #1a5276; color: #fff; padding: 4px 10px; font-size: .78rem; }
  .btn-cert-ind { background: #7d3c98; color: #fff; padding: 4px 10px; font-size: .78rem; }
  .btn-excluir  { background: #c0392b; color: #fff; padding: 4px 10px; font-size: .78rem; }
  .acoes { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .msg-acao { font-size: .88rem; color: #555; }
  .tbl-wrap { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  thead th { background: #402B16; color: #fff; padding: 10px 12px; text-align: left; white-space: nowrap; }
  tbody tr:nth-child(even) { background: #f9fafb; }
  tbody tr:hover { background: #f5ede4; }
  tbody td { padding: 8px 12px; border-bottom: 1px solid #eee; vertical-align: middle; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: .75rem; font-weight: 600; }
  .badge-sim { background: #d5f5e3; color: #1e8449; }
  .badge-nao { background: #fdecea; color: #c0392b; }
  .badge-env { background: #d2b4de; color: #6c3483; }
  .vazio { text-align: center; padding: 40px; color: #aaa; }
  .acoes-cell { display: flex; gap: 6px; align-items: center; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.55); z-index: 1000;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.aberto { display: flex; }
  .modal {
    background: #fff; border-radius: 10px; max-width: 760px; width: 100%;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,.25);
  }
  .modal-header {
    background: #402B16; color: #fff; padding: 16px 20px;
    border-radius: 10px 10px 0 0; display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 1;
  }
  .modal-header h2 { font-size: 1rem; }
  .modal-close { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; line-height: 1; }
  .modal-close:hover { opacity: .7; }
  .modal-body { padding: 20px; }
  .modal-section { margin-bottom: 18px; }
  .modal-section-title {
    font-size: .75rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: #402B16; margin-bottom: 10px;
    padding-bottom: 4px; border-bottom: 1.5px solid #f5ede4;
  }
  .modal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .modal-campo { background: #f9fafb; border-radius: 6px; padding: 8px 12px; }
  .modal-campo .label { font-size: .72rem; color: #888; margin-bottom: 2px; }
  .modal-campo .valor { font-size: .88rem; color: #222; font-weight: 500; word-break: break-word; }
  .modal-campo .valor.mono { font-family: monospace; }
  .modal-campo-full { grid-column: 1 / -1; }
  .badge-modal-sim { background: #d5f5e3; color: #1e8449; }
  .badge-modal-nao { background: #fdecea; color: #c0392b; }
  .badge-modal-env { background: #d2b4de; color: #6c3483; }
  .modal-footer { padding: 14px 20px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<header>
  <h1>Painel Admin — XVII Congresso Fenapestalozzi 2026</h1>
  <a id="btn-sair">Sair</a>
</header>

<div class="container">
  <div class="counters" id="counters">
    <div class="counter"><div class="num" id="cnt-total">—</div><div class="lbl">Total de inscritos</div></div>
    <div class="counter"><div class="num" id="cnt-cert">—</div><div class="lbl">Certificados enviados</div></div>
    <div class="counter"><div class="num" id="cnt-pend">—</div><div class="lbl">Certificados pendentes</div></div>
  </div>

  <div class="filtros">
    <div><label>Busca (nome, e-mail, CPF)</label><input type="text" id="f-busca" placeholder="Digite para buscar..."></div>
    <div><label>Estado (UF)</label>
      <select id="f-uf">
        <option value="">Todos</option>
        <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
        <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
        <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
        <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
        <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
        <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
        <option>SP</option><option>SE</option><option>TO</option>
      </select>
    </div>
    <div><label>Área de atuação</label>
      <select id="f-area">
        <option value="">Todas</option>
        <option>Saúde</option><option>Assistência Social</option>
        <option>Educação</option><option>Esporte</option><option>Trabalho</option>
      </select>
    </div>
    <div><label>Certificado</label>
      <select id="f-cert">
        <option value="">Todos</option>
        <option value="0">Não enviados</option>
        <option value="1">Enviados</option>
      </select>
    </div>
    <button class="btn btn-filtrar" id="btn-filtrar">Filtrar</button>
    <button class="btn btn-limpar"  id="btn-limpar">Limpar</button>
  </div>

  <div class="acoes">
    <button class="btn btn-csv"  id="btn-csv">⬇ Exportar CSV</button>
    <button class="btn btn-cert" id="btn-cert-todos">Enviar certificados para todos</button>
    <span class="msg-acao" id="msg-acao"></span>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Nome</th><th>CPF</th><th>E-mail</th>
          <th>UF</th><th>Área</th><th>PCD</th><th>Certificado</th><th>Inscrito em</th><th>Ações</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- Modal detalhes -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modal-titulo">Detalhes do Inscrito</h2>
      <button class="modal-close" id="modal-fechar">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-excluir" id="modal-btn-excluir">Excluir inscrição</button>
      <button class="btn btn-cert-ind" id="modal-btn-cert">Enviar certificado</button>
      <button class="btn btn-limpar" id="modal-btn-fechar2">Fechar</button>
    </div>
  </div>
</div>

<script>
const token = () => sessionStorage.getItem('admin_token');

if (!token()) window.location.href = '/admin/login.html';

document.getElementById('btn-sair').addEventListener('click', () => {
  sessionStorage.removeItem('admin_token');
  window.location.href = '/admin/login.html';
});

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token()}` };
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtData(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
}

function fmtDataNasc(s) {
  if (!s) return '—';
  const [y, m, d] = s.split('-');
  return `${d}/${m}/${y}`;
}

function arrLabel(v) {
  try { const a = JSON.parse(v); return Array.isArray(a) && a.length ? a.join(', ') : '—'; }
  catch(e) { return v || '—'; }
}

function simNao(v) {
  return v
    ? '<span class="badge badge-sim">Sim</span>'
    : '<span class="badge badge-nao">Não</span>';
}

function campo(label, valor, full = false, mono = false) {
  const cls = 'modal-campo' + (full ? ' modal-campo-full' : '');
  const vcls = 'valor' + (mono ? ' mono' : '');
  return `<div class="${cls}">
    <div class="label">${label}</div>
    <div class="${vcls}">${valor || '—'}</div>
  </div>`;
}

// ─── Lista de inscritos ───────────────────────────────────
let dadosAtual = [];

async function carregarDados(params = {}) {
  const qs = new URLSearchParams(params).toString();
  try {
    const resp = await fetch(`/api/admin/inscritos?${qs}`, { headers: authHeaders() });
    if (resp.status === 401) { sessionStorage.removeItem('admin_token'); window.location.href='/admin/login.html'; return; }
    const json = await resp.json();
    if (!json.success) return;

    document.getElementById('cnt-total').textContent = json.total;
    document.getElementById('cnt-cert').textContent  = json.total_cert;
    document.getElementById('cnt-pend').textContent  = json.total - json.total_cert;

    dadosAtual = json.dados;

    const tbody = document.getElementById('tbody');
    if (!json.dados.length) {
      tbody.innerHTML = '<tr><td colspan="10" class="vazio">Nenhum inscrito encontrado.</td></tr>';
      return;
    }
    tbody.innerHTML = json.dados.map(ins => `
      <tr data-id="${ins.id}">
        <td>${ins.id}</td>
        <td>${esc(ins.nome_social || ins.nome_completo)}</td>
        <td style="font-family:monospace">${esc(ins.cpf_parcial)}</td>
        <td>${esc(ins.email)}</td>
        <td>${esc(ins.uf||'—')}</td>
        <td>${esc(arrLabel(ins.area_atuacao))}</td>
        <td>${ins.pcd ? '<span class="badge badge-sim">Sim</span>' : '<span class="badge badge-nao">Não</span>'}</td>
        <td>${ins.certificado_enviado ? '<span class="badge badge-env">Enviado</span>' : '<span class="badge badge-nao">Pendente</span>'}</td>
        <td>${fmtData(ins.criado_em)}</td>
        <td>
          <div class="acoes-cell">
            <button class="btn btn-ver"       data-id="${ins.id}">Ver</button>
            <button class="btn btn-cert-ind"  data-id="${ins.id}">Cert.</button>
            <button class="btn btn-excluir"   data-id="${ins.id}">Excluir</button>
          </div>
        </td>
      </tr>
    `).join('');

    document.querySelectorAll('.btn-ver').forEach(btn =>
      btn.addEventListener('click', () => abrirModal(parseInt(btn.dataset.id)))
    );
    document.querySelectorAll('.btn-cert-ind').forEach(btn =>
      btn.addEventListener('click', () => enviarCert({ modo: 'individual', id: parseInt(btn.dataset.id) }))
    );
    document.querySelectorAll('.btn-excluir').forEach(btn =>
      btn.addEventListener('click', () => excluirInscrito(parseInt(btn.dataset.id)))
    );

  } catch(e) {
    console.error(e);
  }
}

// ─── Modal detalhes ───────────────────────────────────────
let modalIdAtual = null;

function abrirModal(id) {
  const ins = dadosAtual.find(d => d.id === id);
  if (!ins) return;
  modalIdAtual = id;

  document.getElementById('modal-titulo').textContent =
    `#${ins.id} — ${ins.nome_social || ins.nome_completo}`;

  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <div class="modal-section">
      <div class="modal-section-title">Identificação</div>
      <div class="modal-grid">
        ${campo('Nome completo', esc(ins.nome_completo), true)}
        ${ins.nome_social ? campo('Nome social', esc(ins.nome_social), true) : ''}
        ${campo('CPF', esc(ins.cpf), false, true)}
        ${campo('Data de nascimento', fmtDataNasc(ins.data_nascimento))}
        ${campo('Identidade de gênero', esc(arrLabel(ins.identidade_genero)))}
        ${ins.genero_outro ? campo('Gênero (outro)', esc(ins.genero_outro)) : ''}
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Contato</div>
      <div class="modal-grid">
        ${campo('E-mail', esc(ins.email))}
        ${campo('Telefone', esc(ins.telefone))}
        ${campo('UF', esc(ins.uf))}
        ${campo('Município', esc(ins.municipio))}
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Perfil Profissional</div>
      <div class="modal-grid">
        ${campo('Vínculo Pestalozzi', ins.vinculo_pestalozzi ? 'Sim' : 'Não')}
        ${campo('Formação', esc(ins.formacao))}
        ${campo('Área de atuação', esc(arrLabel(ins.area_atuacao)), true)}
        ${campo('Como soube do evento', esc(arrLabel(ins.como_soube)), true)}
        ${ins.como_soube_outro ? campo('Como soube (outro)', esc(ins.como_soube_outro)) : ''}
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Acessibilidade e Alimentação</div>
      <div class="modal-grid">
        ${campo('PCD', ins.pcd ? 'Sim' : 'Não')}
        ${ins.pcd ? campo('Deficiência', esc(ins.pcd_descricao)) : ''}
        ${ins.pcd ? campo('Recurso de acessibilidade', esc(ins.pcd_recurso)) : ''}
        ${campo('Restrição alimentar', esc(arrLabel(ins.restricao_alimentar)))}
        ${ins.restricao_outro ? campo('Restrição (outro)', esc(ins.restricao_outro)) : ''}
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Termos e Certificado</div>
      <div class="modal-grid">
        ${campo('Aceite LGPD', ins.aceite_lgpd ? 'Sim' : 'Não')}
        ${campo('Autorização uso de imagem', ins.aceite_imagem ? 'Sim' : 'Não')}
        ${campo('Certificado enviado', ins.certificado_enviado ? 'Sim' : 'Não')}
        ${ins.certificado_enviado_em ? campo('Certificado enviado em', fmtData(ins.certificado_enviado_em)) : ''}
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Dados do sistema</div>
      <div class="modal-grid">
        ${campo('ID', ins.id)}
        ${campo('Inscrito em', fmtData(ins.criado_em))}
        ${campo('Hash', ins.hash, true, true)}
      </div>
    </div>
  `;

  document.getElementById('modal-overlay').classList.add('aberto');
}

function fecharModal() {
  document.getElementById('modal-overlay').classList.remove('aberto');
  modalIdAtual = null;
}

document.getElementById('modal-fechar').addEventListener('click', fecharModal);
document.getElementById('modal-btn-fechar2').addEventListener('click', fecharModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) fecharModal();
});

document.getElementById('modal-btn-cert').addEventListener('click', () => {
  if (modalIdAtual) enviarCert({ modo: 'individual', id: modalIdAtual });
});
document.getElementById('modal-btn-excluir').addEventListener('click', () => {
  if (modalIdAtual) excluirInscrito(modalIdAtual, true);
});

// ─── Excluir inscrito ─────────────────────────────────────
async function excluirInscrito(id, viaModal = false) {
  const ins = dadosAtual.find(d => d.id === id);
  const nome = ins ? (ins.nome_social || ins.nome_completo) : `#${id}`;
  if (!confirm(`Excluir definitivamente a inscrição de "${nome}"?\n\nEsta ação não pode ser desfeita.`)) return;

  try {
    const resp = await fetch('/api/admin/deletar', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ id })
    });
    const json = await resp.json();
    if (json.success) {
      if (viaModal) fecharModal();
      document.getElementById('msg-acao').textContent = `Inscrição de "${nome}" removida.`;
      setTimeout(() => { document.getElementById('msg-acao').textContent = ''; }, 3000);
      carregarDados(getParams());
    } else {
      alert('Erro ao excluir: ' + (json.mensagem || 'Tente novamente.'));
    }
  } catch(e) {
    alert('Erro de conexão.');
  }
}

// ─── Filtros ──────────────────────────────────────────────
function getParams() {
  return {
    busca: document.getElementById('f-busca').value,
    uf:    document.getElementById('f-uf').value,
    area:  document.getElementById('f-area').value,
    cert:  document.getElementById('f-cert').value,
  };
}

document.getElementById('btn-filtrar').addEventListener('click', () => carregarDados(getParams()));
document.getElementById('btn-limpar').addEventListener('click', () => {
  document.getElementById('f-busca').value = '';
  document.getElementById('f-uf').value    = '';
  document.getElementById('f-area').value  = '';
  document.getElementById('f-cert').value  = '';
  carregarDados();
});

let debounce;
document.getElementById('f-busca').addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => carregarDados(getParams()), 400);
});

// ─── CSV ──────────────────────────────────────────────────
document.getElementById('btn-csv').addEventListener('click', async () => {
  const resp = await fetch('/api/admin/exportar', { headers: authHeaders() });
  if (resp.status === 401) { sessionStorage.removeItem('admin_token'); window.location.href='/admin/login.html'; return; }
  const blob = await resp.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `inscritos_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

// ─── Certificados ─────────────────────────────────────────
const msgAcao = document.getElementById('msg-acao');
async function enviarCert(payload) {
  if (!confirm(payload.modo === 'todos'
    ? 'Enviar certificados para TODOS os inscritos ainda sem certificado?'
    : 'Enviar certificado para este inscrito?')) return;

  msgAcao.textContent = 'Enviando...';
  try {
    const resp = await fetch('/api/admin/certificado', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify(payload)
    });
    const json = await resp.json();
    msgAcao.textContent = json.mensagem || (json.success ? 'Concluído.' : 'Erro.');
    if (json.success) setTimeout(() => { carregarDados(getParams()); msgAcao.textContent = ''; }, 2000);
  } catch(e) {
    msgAcao.textContent = 'Erro de conexão.';
  }
}

document.getElementById('btn-cert-todos').addEventListener('click', () => enviarCert({ modo: 'todos' }));

// ─── Inicializar ──────────────────────────────────────────
carregarDados();
</script>
</body>
</html>
