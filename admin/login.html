<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Restrito — XVII Congresso Fenapestalozzi 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Open Sans', Arial, sans-serif;
    background: #f3f4f6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .wrap {
    display: flex;
    width: 100%;
    max-width: 880px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.14);
  }
  /* Painel esquerdo — identidade visual */
  .side-brand {
    background: #D52B27;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 36px;
    text-align: center;
  }
  .side-logo {
    width: 100%;
    max-width: 240px;
    margin-bottom: 32px;
    background: #fff;
    border-radius: 12px;
    padding: 16px 20px;
  }
  .side-logo img { width: 100%; display: block; }
  .side-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.4;
    margin-bottom: 8px;
  }
  .side-sub {
    font-size: .82rem;
    color: rgba(255,255,255,.75);
    line-height: 1.6;
  }
  .side-divider {
    width: 40px; height: 3px;
    background: rgba(255,255,255,.4);
    border-radius: 2px;
    margin: 20px auto;
  }
  /* Painel direito — formulário */
  .side-form {
    background: #fff;
    width: 380px;
    min-width: 320px;
    padding: 48px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .form-icon {
    width: 48px; height: 48px;
    background: #FEF2F2;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 20px;
  }
  .form-titulo {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 6px;
  }
  .form-sub {
    font-size: .83rem;
    color: #6B7280;
    margin-bottom: 32px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: .75rem;
    font-weight: 700;
    color: #6B7280;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
    font-family: 'Montserrat', sans-serif;
  }
  input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #E5E7EB;
    border-radius: 8px;
    font-size: .95rem;
    margin-bottom: 18px;
    font-family: 'Open Sans', sans-serif;
    color: #111827;
    transition: border-color .15s;
  }
  input:focus { outline: none; border-color: #D52B27; }
  .btn {
    width: 100%;
    padding: 13px;
    background: #D52B27;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    transition: background .15s;
    margin-top: 4px;
  }
  .btn:hover { background: #AA1F1C; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .erro {
    background: #FEE2E2;
    color: #991B1B;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: .85rem;
    margin-bottom: 18px;
    display: none;
  }
  @media (max-width: 680px) {
    .wrap { flex-direction: column; max-width: 420px; }
    .side-brand { padding: 32px 24px; }
    .side-logo { max-width: 180px; margin-bottom: 20px; }
    .side-form { width: 100%; padding: 36px 28px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- Lado esquerdo: identidade visual -->
  <div class="side-brand">
    <div class="side-logo">
      <img src="/admin/logo-fenapestalozzi.png" alt="Fenapestalozzi">
    </div>
    <div class="side-divider"></div>
    <div class="side-title">XVII Congresso<br>Fenapestalozzi 2026</div>
    <div class="side-sub">10 a 13 de novembro de 2026<br>Brasília, DF</div>
  </div>

  <!-- Lado direito: formulário -->
  <div class="side-form">
    <div class="form-icon">🔐</div>
    <div class="form-titulo">Acesso restrito</div>
    <div class="form-sub">Entre com suas credenciais de administrador para acessar o painel.</div>
    <div class="erro" id="erro"></div>
    <form id="form-login">
      <label>Usuário</label>
      <input type="text" id="usuario" autocomplete="username" required placeholder="Seu usuário">
      <label>Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required placeholder="••••••••">
      <button type="submit" class="btn" id="btn-login">Entrar no painel</button>
    </form>
  </div>
</div>
<script>
  if (sessionStorage.getItem('admin_token')) {
    window.location.href = '/admin/index.html';
  }

  document.getElementById('form-login').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    const erroEl = document.getElementById('erro');
    btn.disabled = true; btn.textContent = 'Entrando...';
    erroEl.style.display = 'none';
    try {
      const resp = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          usuario: document.getElementById('usuario').value,
          senha:   document.getElementById('senha').value,
        })
      });
      const json = await resp.json();
      if (json.success) {
        sessionStorage.setItem('admin_token', json.token);
        window.location.href = '/admin/index.html';
      } else {
        erroEl.textContent = json.mensagem || 'Usuário ou senha incorretos.';
        erroEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Entrar no painel';
      }
    } catch {
      erroEl.textContent = 'Erro de conexão. Tente novamente.';
      erroEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Entrar no painel';
    }
  });
</script>
</body>
</html>
